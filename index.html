<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Invisible 🏐 - Club Volei Esparreguera</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Fredoka', 'sans-serif'],
                        body: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        esparreguera: {
                            dark: '#2A0835',
                            purple: '#5B1A73',
                            violet: '#8E28B7',
                            lilac: '#BA52ED',
                            lightLilac: '#F3E5F8',
                            accent: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(rgba(42, 8, 53, 0.85), rgba(91, 26, 115, 0.85)), url('fondo-voley.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .font-heading { font-family: 'Fredoka', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="text-slate-800 pb-12">

    <!-- Header Banner Club Volei Esparreguera -->
    <header class="bg-gradient-to-r from-esparreguera-dark via-esparreguera-purple to-esparreguera-violet text-white shadow-xl border-b-4 border-esparreguera-lilac">
        <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="showHomeView()">
                <div class="w-14 h-14 rounded-full bg-white p-0.5 shadow-md flex items-center justify-center border-2 border-esparreguera-lilac flex-shrink-0 overflow-hidden">
                    <img src="logo.png" alt="Logo Club Volei Esparreguera" class="w-full h-full object-cover rounded-full" onerror="this.onerror=null; this.parentElement.innerHTML='🏐';">
                </div>

                <div class="text-center md:text-left">
                    <span class="bg-esparreguera-lilac text-esparreguera-dark font-black text-[10px] px-3 py-0.5 rounded-full uppercase tracking-widest shadow-sm">
                        Club Volei Esparreguera 🏐
                    </span>
                    <h1 class="text-2xl md:text-3xl font-extrabold font-heading text-white mt-0.5">
                        Amigo Invisible <span class="text-esparreguera-lightLilac">Esparreguera</span> 🎁
                    </h1>
                </div>
            </div>

            <!-- Header Action Buttons -->
            <div class="flex items-center gap-2">
                <button onclick="showHomeView()" class="bg-white/10 hover:bg-white/20 text-white font-bold px-3 py-2 rounded-xl border border-white/20 text-xs flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-house"></i> Inicio
                </button>
                <button onclick="openAddPlayerModal()" class="bg-esparreguera-lilac hover:bg-purple-400 text-esparreguera-dark font-black px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-md transition">
                    <i class="fa-solid fa-user-plus"></i> Añadir Jugadora
                </button>
                <button onclick="copyAllSummaries()" class="bg-amber-400 hover:bg-amber-300 text-esparreguera-dark font-black px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-md transition">
                    <i class="fa-solid fa-share-nodes"></i> Copiar para WhatsApp
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 mt-6">

        <!-- VISTA PRINCIPAL (INICIO) -->
        <div id="homeView" class="space-y-6">
            <div class="glass-card p-4 rounded-2xl shadow-md flex flex-col sm:flex-row items-center justify-between gap-3 border border-purple-200">
                <div class="relative w-full sm:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-purple-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderHomeGrid()" placeholder="Buscar jugadora..." class="w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-purple-200 focus:ring-2 focus:ring-esparreguera-violet outline-none bg-white">
                </div>
                <div class="text-xs font-bold text-esparreguera-purple bg-esparreguera-lightLilac px-4 py-2 rounded-xl w-full sm:w-auto text-center border border-purple-200">
                    Equipo: <span id="totalPlayersCount" class="text-esparreguera-dark font-black text-sm">0</span> jugadoras
                </div>
            </div>

            <div id="playersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Tarjetas inyectadas dinámicamente -->
            </div>
        </div>

        <!-- VISTA PERFIL INDIVIDUAL -->
        <div id="profileView" class="hidden space-y-6">
            <div class="glass-card p-4 rounded-2xl shadow-md flex items-center justify-between border border-purple-200">
                <button onclick="showHomeView()" class="text-esparreguera-purple hover:text-esparreguera-dark text-xs font-black flex items-center gap-2 bg-esparreguera-lightLilac hover:bg-purple-200 px-3 py-2 rounded-xl transition">
                    <i class="fa-solid fa-arrow-left"></i> Volver a la lista
                </button>
                
                <div class="flex items-center gap-2">
                    <button onclick="navigateProfile(-1)" class="p-2 text-esparreguera-purple hover:bg-purple-100 rounded-xl text-xs font-bold" title="Anterior">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <span id="profileNavIndex" class="text-xs font-bold text-purple-700">1 / 5</span>
                    <button onclick="navigateProfile(1)" class="p-2 text-esparreguera-purple hover:bg-purple-100 rounded-xl text-xs font-bold" title="Siguiente">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <div class="glass-card rounded-3xl p-6 shadow-xl border-2 border-white space-y-6">
                <div class="flex flex-col sm:flex-row items-center gap-4 bg-gradient-to-r from-esparreguera-purple via-esparreguera-violet to-esparreguera-lilac text-white p-5 rounded-2xl relative overflow-hidden shadow-md">
                    <div id="profileAvatarDisplay" class="text-5xl bg-white/20 p-3 rounded-2xl shadow-inner border border-white/30">🏐</div>
                    <div class="text-center sm:text-left flex-1">
                        <h2 id="profileNameDisplay" class="text-2xl font-black font-heading">Nombre Jugadora</h2>
                        <p id="profilePosDisplay" class="text-xs text-amber-300 font-bold uppercase tracking-wider">Club Volei Esparreguera</p>
                    </div>
                    <button onclick="saveCurrentProfile()" class="bg-amber-400 hover:bg-amber-300 text-esparreguera-dark font-black text-xs px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-1.5">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Perfil
                    </button>
                </div>

                <div class="bg-purple-50/60 p-4 rounded-2xl border border-purple-200 space-y-3">
                    <h3 class="text-xs font-black uppercase text-esparreguera-dark tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-pen-to-square text-esparreguera-violet"></i> Datos Principales
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nombre jugadora</label>
                            <input type="text" id="editName" class="w-full px-3 py-2 border border-purple-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-esparreguera-violet outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Posición / Rol</label>
                            <input type="text" id="editPosition" placeholder="Ej: Rematadora, Líbero..." class="w-full px-3 py-2 border border-purple-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-esparreguera-violet outline-none bg-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Elige tu Avatar</label>
                        <div class="flex flex-wrap gap-2" id="avatarPickerContainer"></div>
                    </div>
                </div>

                <div class="bg-emerald-50/80 p-4 rounded-2xl border border-emerald-200 space-y-3">
                    <h3 class="text-xs font-black uppercase text-emerald-900 tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-check text-emerald-600"></i> Lo que SÍ me gustaría (Ideas de regalo) 🎁
                    </h3>
                    <div class="flex gap-2">
                        <input type="text" id="wishInput" placeholder="Ej: Calcetines altos, botella..." class="flex-1 px-3 py-2 border border-emerald-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <button onclick="addWishItem()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition">+ Añadir</button>
                    </div>
                    <ul id="wishList" class="space-y-2"></ul>
                </div>

                <div class="bg-rose-50/80 p-4 rounded-2xl border border-rose-200 space-y-3">
                    <h3 class="text-xs font-black uppercase text-rose-900 tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-xmark text-rose-600"></i> Lo que NO me gustaría recibir ❌
                    </h3>
                    <div class="flex gap-2">
                        <input type="text" id="dontWantInput" placeholder="Ej: Colonias fuertes, tazas..." class="flex-1 px-3 py-2 border border-rose-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 bg-white">
                        <button onclick="addDontWantItem()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition">+ Añadir</button>
                    </div>
                    <ul id="dontWantList" class="space-y-2"></ul>
                </div>

                <div class="bg-purple-50/80 p-4 rounded-2xl border border-purple-200 space-y-3">
                    <h3 class="text-xs font-black uppercase text-esparreguera-dark tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-shirt text-esparreguera-violet"></i> Tallas, Colores y Pistas
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Talla Ropa</label>
                            <input type="text" id="editSize" placeholder="Ej: M" class="w-full px-3 py-2 border border-purple-200 rounded-xl text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Talla Zapatillas</label>
                            <input type="text" id="editShoeSize" placeholder="Ej: 39 EU" class="w-full px-3 py-2 border border-purple-200 rounded-xl text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Color Favorito</label>
                            <input type="text" id="editColor" placeholder="Ej: Lila / Morado" class="w-full px-3 py-2 border border-purple-200 rounded-xl text-sm bg-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Notas adicionales o detalles</label>
                        <textarea id="editNotes" rows="2" placeholder="Ej: Me encantan los chocolates..." class="w-full px-3 py-2 border border-purple-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-esparreguera-violet"></textarea>
                    </div>
                </div>

                <div class="flex justify-between items-center pt-2">
                    <button type="button" onclick="deleteCurrentPlayer()" class="text-rose-600 hover:text-rose-800 text-xs font-bold flex items-center gap-1 cursor-pointer">
                        <i class="fa-solid fa-trash"></i> Eliminar jugadora
                    </button>
                    <button onclick="saveCurrentProfile()" class="bg-esparreguera-purple hover:bg-esparreguera-dark text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-lg transition">
                        Guardar Cambios
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Añadir Nueva Jugadora -->
    <div id="addPlayerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden border-4 border-esparreguera-lilac">
            <div class="bg-esparreguera-purple text-white p-4 flex justify-between items-center">
                <h3 class="text-lg font-black font-heading">🏐 Añadir Jugadora</h3>
                <button onclick="closeAddPlayerModal()" class="text-white hover:text-purple-200 font-bold">✕</button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nombre *</label>
                    <input type="text" id="newPlayerName" placeholder="Ej: Sofía" class="w-full px-3 py-2 border border-purple-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-esparreguera-violet">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Posición en cancha</label>
                    <input type="text" id="newPlayerPos" placeholder="Ej: Central" class="w-full px-3 py-2 border border-purple-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-esparreguera-violet">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Avatar</label>
                    <div class="flex flex-wrap gap-2" id="addAvatarPicker"></div>
                </div>
            </div>
            <div class="bg-purple-50 p-4 border-t border-purple-100 flex justify-end gap-2">
                <button onclick="closeAddPlayerModal()" class="px-3 py-1.5 text-xs text-slate-600 font-bold hover:bg-purple-100 rounded-lg">Cancelar</button>
                <button onclick="confirmAddPlayer()" class="px-4 py-1.5 text-xs bg-esparreguera-violet hover:bg-esparreguera-purple text-white font-bold rounded-lg shadow">Añadir</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIE6_448c1BXbdsA8rwZEumnTGl0Re7D0",
            authDomain: "amigo-invisible-voley.firebaseapp.com",
            databaseURL: "https://amigo-invisible-voley-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "amigo-invisible-voley",
            storageBucket: "amigo-invisible-voley.firebasestorage.app",
            messagingSenderId: "981063697812",
            appId: "1:981063697812:web:1072941383c4b687b37b81",
            measurementId: "G-Y0LMZVE49N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const playersRef = ref(db, 'players');

        const AVATAR_CATEGORIES = [
            {
                name: "🎅 Navidad & Volei",
                avatars: [
                    { id: 'grinch', label: 'El Grinch', icon: '🤢' },
                    { id: 'santa', label: 'Papa Noel', icon: '🎅' },
                    { id: 'mrs_claus', label: 'Mama Noel', icon: '🤶' },
                    { id: 'elf', label: 'Elfo Travieso', icon: '🧝' },
                    { id: 'rudolph', label: 'Reno Rematador', icon: '🦌' },
                    { id: 'snowman', label: 'Muñeco de Nieve', icon: '☃️' },
                    { id: 'tree_voley', label: 'Árbol Navideño', icon: '🎄' }
                ]
            },
            {
                name: "🐾 Animales Voleibolistas",
                avatars: [
                    { id: 'cat_spiker', label: 'Gato Rematador', icon: '🐱' },
                    { id: 'dog_libero', label: 'Perro Líbero', icon: '🐶' },
                    { id: 'bear_setter', label: 'Oso Colocador', icon: '🐻' },
                    { id: 'fox_tactics', label: 'Zorro Estratega', icon: '🦊' },
                    { id: 'panda_block', label: 'Panda Bloqueador', icon: '🐼' },
                    { id: 'unicorn_ace', label: 'Unicornio Saque Directo', icon: '🦄' },
                    { id: 'tiger_power', label: 'Tigre Potencia', icon: '🐯' }
                ]
            },
            {
                name: "🔥 Memes & Post-Partido",
                avatars: [
                    { id: 'net_fail', label: '¡En la Red!', icon: '🕸️' },
                    { id: 'ball_face', label: 'Balón a la Cara', icon: '🤪' },
                    { id: 'beer_third_time', label: 'Cerveza Post-Partido', icon: '🍻' },
                    { id: 'pizza_team', label: 'Pizza de Equipo', icon: '🍕' },
                    { id: 'queen_court', label: 'Reina de la Pista', icon: '👑' },
                    { id: 'fire_ace', label: 'Saque de Fuego', icon: '🔥' },
                    { id: 'injured_hero', label: 'Kinesiotape & Hielo', icon: '🩹' }
                ]
            },
            {
                name: "🏐 Clásicos Club Esparreguera",
                avatars: [
                    { id: 'voley_purple', label: 'Balón Lila', icon: '🏐' },
                    { id: 'purple_heart', label: 'Corazón Lila', icon: '💜' },
                    { id: 'trophy', label: 'Copa Campeonas', icon: '🏆' },
                    { id: 'gold_medal', label: 'Medalla de Oro', icon: '🥇' },
                    { id: 'gift_box', label: 'Regalo Amigo Invisible', icon: '🎁' },
                    { id: 'star_player', label: 'Estrella MVP', icon: '⭐' }
                ]
            }
        ];

        const DEFAULT_PLAYERS = [
            {
                id: '1',
                name: 'Paula',
                position: 'Colocadora',
                avatar: '👑',
                wishes: ['Calcetines de voleibol blancos o lilas', 'Cinta para el pelo ancha'],
                dontWants: ['Colonias de olor muy dulce', 'Tazas de café'],
                size: 'M',
                shoeSize: '39 EU',
                color: 'Lila / Morado',
                notes: 'Me encantan los chocolates y snacks salados.'
            },
            {
                id: '2',
                name: 'Laura',
                position: 'Rematadora',
                avatar: '🤢',
                wishes: ['Manga de compresión para brazo', 'Botella térmica para agua (1L)'],
                dontWants: ['Maquillaje', 'Velas aromáticas'],
                size: 'S',
                shoeSize: '38 EU',
                color: 'Negro / Lila',
                notes: 'Siempre me faltan gomas de pelo para los entrenos.'
            },
            {
                id: '3',
                name: 'Marta',
                position: 'Líbero',
                avatar: '🐶',
                wishes: ['Rodilleras acolchadas blancas', 'Toalla de microfibra deportiva'],
                dontWants: ['Libretas o agendas de papel'],
                size: 'XS',
                shoeSize: '37 EU',
                color: 'Morado Esparreguera',
                notes: 'Prefiero cosas útiles para los partidos.'
            }
        ];

        let players = [];
        let activePlayerId = null;
        let selectedAddAvatar = '🏐';
        let selectedEditAvatar = '🏐';

        // Escuchar cambios en la nube en tiempo real
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                players = Array.isArray(data) ? data : Object.values(data);
            } else {
                players = DEFAULT_PLAYERS;
                saveDataToFirebase();
            }
            renderHomeGrid();
            renderAvatarPickers();
        });

        function saveDataToFirebase() {
            set(playersRef, players);
        }

        window.renderHomeGrid = function() {
            const grid = document.getElementById('playersGrid');
            const searchInput = document.getElementById('searchInput');
            const search = searchInput ? searchInput.value.toLowerCase().trim() : '';
            grid.innerHTML = '';

            const filtered = players.filter(p => p.name.toLowerCase().includes(search) || (p.position && p.position.toLowerCase().includes(search)));
            document.getElementById('totalPlayersCount').innerText = players.length;

            filtered.forEach(player => {
                const wishCount = player.wishes ? player.wishes.length : 0;
                const hasInfo = wishCount > 0;

                const card = document.createElement('div');
                card.className = "glass-card rounded-3xl p-5 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer border-2 border-white flex flex-col justify-between group";
                card.onclick = () => openProfileView(player.id);

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-4xl bg-purple-100 p-2.5 rounded-2xl border border-purple-200">${player.avatar || '🏐'}</span>
                            <span class="text-[10px] font-black uppercase px-2.5 py-1 rounded-full ${hasInfo ? 'bg-purple-100 text-esparreguera-purple border border-purple-300' : 'bg-slate-100 text-slate-500'}">
                                ${hasInfo ? `💜 ${wishCount} deseos` : '⏳ Sin rellenar'}
                            </span>
                        </div>
                        <h3 class="text-xl font-black font-heading text-esparreguera-dark group-hover:text-esparreguera-violet transition-colors">
                            ${escapeHtml(player.name)}
                        </h3>
                        <p class="text-xs font-bold text-slate-500 mb-3">
                            🏐 ${escapeHtml(player.position || 'Jugadora Esparreguera')}
                        </p>
                    </div>

                    <div class="mt-4 pt-3 border-t border-purple-100 flex justify-between items-center text-xs font-black text-esparreguera-violet">
                        <span>Ver / Editar Perfil</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        window.showHomeView = function() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('profileView').classList.add('hidden');
            renderHomeGrid();
        };

        window.openProfileView = function(id) {
            activePlayerId = id;
            const player = players.find(p => p.id === id);
            if (!player) return;

            document.getElementById('profileNameDisplay').innerText = player.name;
            document.getElementById('profilePosDisplay').innerText = player.position || 'Club Volei Esparreguera';
            document.getElementById('profileAvatarDisplay').innerText = player.avatar || '🏐';

            document.getElementById('editName').value = player.name;
            document.getElementById('editPosition').value = player.position || '';
            document.getElementById('editSize').value = player.size || '';
            document.getElementById('editShoeSize').value = player.shoeSize || '';
            document.getElementById('editColor').value = player.color || '';
            document.getElementById('editNotes').value = player.notes || '';

            selectedEditAvatar = player.avatar || '🏐';
            updateAvatarPickerUI('avatarPickerContainer', selectedEditAvatar, (av) => {
                selectedEditAvatar = av;
                document.getElementById('profileAvatarDisplay').innerText = av;
            });

            renderWishList(player.wishes || []);
            renderDontWantList(player.dontWants || []);

            const index = players.findIndex(p => p.id === id);
            document.getElementById('profileNavIndex').innerText = `${index + 1} / ${players.length}`;

            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('profileView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.navigateProfile = function(direction) {
            const currentIndex = players.findIndex(p => p.id === activePlayerId);
            if (currentIndex === -1) return;
            let nextIndex = currentIndex + direction;
            if (nextIndex < 0) nextIndex = players.length - 1;
            if (nextIndex >= players.length) nextIndex = 0;
            openProfileView(players[nextIndex].id);
        };

        window.saveCurrentProfile = function() {
            if (!activePlayerId) return;
            const player = players.find(p => p.id === activePlayerId);
            if (!player) return;

            const name = document.getElementById('editName').value.trim();
            if (!name) {
                alert("El nombre no puede estar vacío");
                return;
            }

            player.name = name;
            player.position = document.getElementById('editPosition').value.trim();
            player.avatar = selectedEditAvatar;
            player.size = document.getElementById('editSize').value.trim();
            player.shoeSize = document.getElementById('editShoeSize').value.trim();
            player.color = document.getElementById('editColor').value.trim();
            player.notes = document.getElementById('editNotes').value.trim();

            saveDataToFirebase();
            alert("💜 ¡Perfil guardado correctamente!");
            showHomeView();
        };

        window.deleteCurrentPlayer = function() {
            if (!activePlayerId) return;
            const player = players.find(p => p.id === activePlayerId);
            if (!player) return;

            if (confirm(`¿Seguro que quieres eliminar a ${player.name} de la lista del equipo?`)) {
                players = players.filter(p => p.id !== activePlayerId);
                saveDataToFirebase();
                showHomeView();
            }
        };

        function renderWishList(items) {
            const list = document.getElementById('wishList');
            list.innerHTML = '';
            if (items.length === 0) {
                list.innerHTML = `<li class="text-xs text-slate-400 italic">No has añadido ideas de regalo todavía.</li>`;
                return;
            }
            items.forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-emerald-200 text-sm font-semibold text-slate-700 shadow-sm";
                li.innerHTML = `
                    <span>🎁 ${escapeHtml(item)}</span>
                    <button onclick="removeWishItem(${idx})" class="text-slate-400 hover:text-rose-600 font-bold px-1">✕</button>
                `;
                list.appendChild(li);
            });
        }

        window.addWishItem = function() {
            const input = document.getElementById('wishInput');
            const val = input.value.trim();
            if (!val || !activePlayerId) return;
            const player = players.find(p => p.id === activePlayerId);
            if (player) {
                if (!player.wishes) player.wishes = [];
                player.wishes.push(val);
                renderWishList(player.wishes);
                input.value = '';
            }
        };

        window.removeWishItem = function(idx) {
            const player = players.find(p => p.id === activePlayerId);
            if (player && player.wishes) {
                player.wishes.splice(idx, 1);
                renderWishList(player.wishes);
            }
        };

        function renderDontWantList(items) {
            const list = document.getElementById('dontWantList');
            list.innerHTML = '';
            if (items.length === 0) {
                list.innerHTML = `<li class="text-xs text-slate-400 italic">No has puesto nada en la lista de cosas a evitar.</li>`;
                return;
            }
            items.forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-rose-200 text-sm font-semibold text-slate-700 shadow-sm";
                li.innerHTML = `
                    <span>❌ ${escapeHtml(item)}</span>
                    <button onclick="removeDontWantItem(${idx})" class="text-slate-400 hover:text-rose-600 font-bold px-1">✕</button>
                `;
                list.appendChild(li);
            });
        }

        window.addDontWantItem = function() {
            const input = document.getElementById('dontWantInput');
            const val = input.value.trim();
            if (!val || !activePlayerId) return;
            const player = players.find(p => p.id === activePlayerId);
            if (player) {
                if (!player.dontWants) player.dontWants = [];
                player.dontWants.push(val);
                renderDontWantList(player.dontWants);
                input.value = '';
            }
        };

        window.removeDontWantItem = function(idx) {
            const player = players.find(p => p.id === activePlayerId);
            if (player && player.dontWants) {
                player.dontWants.splice(idx, 1);
                renderDontWantList(player.dontWants);
            }
        };

        function renderAvatarPickers() {
            updateAvatarPickerUI('addAvatarPicker', selectedAddAvatar, (av) => {
                selectedAddAvatar = av;
            });
        }

        function updateAvatarPickerUI(containerId, currentSelected, onSelectCallback) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            AVATAR_CATEGORIES.forEach(cat => {
                const groupDiv = document.createElement('div');
                groupDiv.className = "w-full mb-2";
                
                const title = document.createElement('span');
                title.className = "block text-[10px] font-black uppercase text-purple-700 mb-1";
                title.innerText = cat.name;
                groupDiv.appendChild(title);

                const row = document.createElement('div');
                row.className = "flex flex-wrap gap-1.5";

                cat.avatars.forEach(av => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    const isSelected = currentSelected === av.icon;
                    btn.className = `w-9 h-9 rounded-xl text-lg flex items-center justify-center transition border ${isSelected ? 'bg-esparreguera-violet text-white border-esparreguera-dark shadow-md scale-105' : 'bg-white hover:bg-purple-100 border-purple-200'}`;
                    btn.title = av.label;
                    btn.innerText = av.icon;
                    btn.onclick = () => {
                        onSelectCallback(av.icon);
                        updateAvatarPickerUI(containerId, av.icon, onSelectCallback);
                    };
                    row.appendChild(btn);
                });

                groupDiv.appendChild(row);
                container.appendChild(groupDiv);
            });
        }

        window.openAddPlayerModal = function() {
            document.getElementById('newPlayerName').value = '';
            document.getElementById('newPlayerPos').value = '';
            selectedAddAvatar = '🏐';
            renderAvatarPickers();
            document.getElementById('addPlayerModal').classList.remove('hidden');
        };

        window.closeAddPlayerModal = function() {
            document.getElementById('addPlayerModal').classList.add('hidden');
        };

        window.confirmAddPlayer = function() {
            const name = document.getElementById('newPlayerName').value.trim();
            if (!name) {
                alert("Por favor, escribe el nombre de la jugadora.");
                return;
            }
            const position = document.getElementById('newPlayerPos').value.trim();

            const newPlayer = {
                id: 'p_' + Date.now(),
                name: name,
                position: position || 'Jugadora Esparreguera',
                avatar: selectedAddAvatar,
                wishes: [],
                dontWants: [],
                size: '',
                shoeSize: '',
                color: '',
                notes: ''
            };

            players.push(newPlayer);
            saveDataToFirebase();
            closeAddPlayerModal();
            showHomeView();
        };

        window.copyAllSummaries = function() {
            if (players.length === 0) {
                alert("No hay jugadoras en la lista.");
                return;
            }

            let text = "🏐 *LISTA DE DESEOS - AMIGO INVISIBLE CV ESPARREGUERA* 🎁\n\n";
            players.forEach((p, idx) => {
                text += `${idx + 1}. *${p.name}* (${p.position || 'Jugadora'}) ${p.avatar || '🏐'}\n`;
                if (p.wishes && p.wishes.length > 0) {
                    text += `   🎁 *Sí quiero:* ${p.wishes.join(', ')}\n`;
                } else {
                    text += `   🎁 *Sí quiero:* (Sin especificar)\n`;
                }
                if (p.dontWants && p.dontWants.length > 0) {
                    text += `   ❌ *Evitar:* ${p.dontWants.join(', ')}\n`;
                }
                if (p.size || p.shoeSize || p.color) {
                    text += `   👕 *Tallas/Color:* ${[p.size ? 'Talla: '+p.size : '', p.shoeSize ? 'Calzado: '+p.shoeSize : '', p.color ? 'Color: '+p.color : ''].filter(Boolean).join(' - ')}\n`;
                }
                if (p.notes) {
                    text += `   📌 *Notas:* ${p.notes}\n`;
                }
                text += `\n`;
            });

            navigator.clipboard.writeText(text).then(() => {
                alert("¡Resumen copiado al portapapeles! Ya puedes pegarlo en WhatsApp 📱");
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&#039;');
        }
    </script>
</body>
</html>
